# Codex CLI project config. Codex reads it only once you trust this project (it asks on first start).
# Codex does not expand environment variables in this file. For a portfolio group whose MCP server uses a port other than 55206,
# edit the URL below, or pass it on start: codex -c 'mcp_servers.invmon-mcp.url="http://localhost:<port>/mcp"'

# The skills research current news; "live" fetches pages instead of serving them from a cache.
web_search = "live"

[mcp_servers.invmon-mcp]
url = "http://localhost:55206/mcp"
